server {
    listen 80;
    listen [::]:80;
    server_name dental.know11know.top api.know11know.top;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/dental-acme; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dental.know11know.top api.know11know.top;
    ssl_certificate /etc/letsencrypt/live/dental-rebuild/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dental-rebuild/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 2m;
    root /opt/dental-rebuild/releases/20261026/web;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/dental-acme; try_files $uri =404; }
    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        add_header Cache-Control no-store always;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
