server.address=127.0.0.1
server.port=18081
server.shutdown=graceful
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=30000
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=64
server.tomcat.accept-count=20
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
dental.wechat.enabled=true
dental.wechat.binding-schema-reviewed=true
dental.wechat.app-id=wx4ce7918a5993372b
logging.level.root=INFO
logging.level.jdk.httpclient=OFF
logging.level.java.net.http=OFF

spring.datasource.hikari.data-source-properties.treatMysqlDatetimeAsTimestamp=true
