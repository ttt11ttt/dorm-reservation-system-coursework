server.address=127.0.0.1
server.port=${DENTAL_HTTP_PORT:18080}
spring.datasource.url=${DENTAL_DB_URL}
spring.datasource.username=${DENTAL_DB_USER}
spring.datasource.password=${DENTAL_DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00', SESSION sql_mode = 'STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
# AppSecret is read directly from DENTAL_WECHAT_APP_SECRET by the login boundary.
# Private configuration, reviewed schema and independent patient binding are all required.
dental.wechat.enabled=${DENTAL_WECHAT_ENABLED:false}
dental.wechat.app-id=${DENTAL_WECHAT_APP_ID:}
